name: Cypress tests
on:
  push:
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, electron]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and the Cypress binary
        # newer npm blocks package install scripts, so download the binary explicitly
        run: |
          npm ci
          npx cypress install
          npx cypress verify
      - uses: cypress-io/github-action@v6
        with:
          install: false
          browser: ${{ matrix.browser }}
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
